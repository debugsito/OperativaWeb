version: 1
frontend:
  phases:
    preBuild:
      commands:
        # react-scripts 4 no compila con Node 17+ (ERR_OSSL_EVP_UNSUPPORTED).
        - nvm install 16
        - nvm use 16
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
